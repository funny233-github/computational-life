name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the tests are .ts run by node, so typecheck them separately: a typo in a
      # test must fail here, not silently pass through type stripping
      - run: npm run typecheck:tests
      - run: npm test
